<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab 3</title>
</head>
<body>
    <form action="" method="POST">
        <label for="select">Choose your gift</label>
        <select id="select">
            <option>watch</option>
            <option selected>book</option>
            <option>perfume</option>
            <option>headphones</option>
        </select>
        <button>Submit</button>
    </form>

    <h2>Survey from</h2>
    <form>
        <p>What types of music do you enjoy?</p>
        <input type="checkbox" id="music1" name="music1">
        <label for="music1">rock</label>
        <input type="checkbox" id="music2" name="music2">
        <label for="music2">pop</label>
        <input type="checkbox" id="music3" name="music3">
        <label for="music3">jazz</label>
        <input type="checkbox" id="music4" name="music4">
        <label for="music4">classical</label>
        <button>Submit</button>
    </form>

    <h2>payment form</h2>
    <form action="#" method="POST">
        <p>choose your payment method</p>
        <input type="radio" id="radio1" name="radio">
        <label for="radio1">credit card</label>
        <input type="radio" id="radio2" name="radio">
        <label for="radio2">pay pal</label>
        <input type="radio" id="radio3" name="radio">
        <label for="radio3">bank transfer</label>
        <button>submit</button>
    </form>

    


</body>
</html>
