<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lsb 7</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="container mx-auo p-10 text-center bg-gray-100">
    <div>
    <h1 class="font-bold p-5 text-5xl bg-linear-to-r from-indigo-500 to-pink-500 bg-clip-text text-transparent drop-shadow-lg">Welcome to My Page</h1>
    <p class="text-base text-gray-600 font-medium italic tracking-wide">This is a short introduction paragraph.</p>
    <button class="bg-teal-600 text-white shadow px-5 py-2 rounded-full hover:bg-teal-800">Click Me</button>
    </div>

    <div class="mt-12">
    <h2 class="text-uppercase font-semibold italic underline decoration-wavy text-2xl tracking-wide">Contact</h2>
    <form>
        <input type="text" placeholder="Your Name" class="w-full border-2 rounded-md p-3 shadow mb-5 focus:ring focus:ring-blue-300">
        <input type="email" placeholder="Your Email" class="w-full border-2 rounded-md p-3 shadow mb-5 focus:ring focus:ring-blue-300">
        <button type="submit" class="block mx-auto bg-black uppercase text-white font-bold p-3 w-full md:w-1/2 text-center hover:text-gray-800">Send</button>
    </form>
    </div>
</div>

<div class="max-w-sm shadow rounded-lg border p-4">
  <img src="https://via.placeholder.com/400x200" alt="Sample image" class="w-full rounded-lg">
  <h2 class="text-xl font-bold mt-3">Card Title</h2>
  <pt class="text-gray-600 text-sm">This is some description text inside the card.</p>
  <button class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700 sm:w-auto">Read More</button>
</div>

</body>
</html>
